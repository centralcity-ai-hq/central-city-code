<title>Room Suggestions</title>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: the room canvas behind; one quiet suggestion card; each suggestion opens its own small, focused sheet. */
:root{
  --bg:#ffffff;--bg2:#f6f8fc;--surface:#ffffff;--sunken:#f4f6fa;--line:#e5e9f0;
  --text:#0f172a;--muted:#64748b;--faint:#94a3b8;
  --accent:#2563eb;--accent-soft:#eaf1ff;--accent-line:#c7d7fb;--ok:#16a34a;--ok-soft:#ecfdf3;--bad:#dc2626;
  --scrim:rgba(15,23,42,.32);--shadow:0 24px 60px rgba(15,23,42,.14);--shadow-s:0 6px 18px rgba(15,23,42,.06);
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--bg2:#0d1326;--surface:#121a31;--sunken:#18213b;--line:#243049;--text:#eef2f8;--muted:#a3b0c6;--faint:#6b7a96;--accent:#5b8cff;--accent-soft:#1a2a52;--accent-line:#2c4380;--ok:#4ade80;--ok-soft:#10301f;--bad:#f87171;--scrim:rgba(0,0,0,.55);--shadow:0 24px 60px rgba(0,0,0,.5);--shadow-s:0 6px 18px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--bg2:#0d1326;--surface:#121a31;--sunken:#18213b;--line:#243049;--text:#eef2f8;--muted:#a3b0c6;--faint:#6b7a96;--accent:#5b8cff;--accent-soft:#1a2a52;--accent-line:#2c4380;--ok:#4ade80;--ok-soft:#10301f;--bad:#f87171;--scrim:rgba(0,0,0,.55);--shadow:0 24px 60px rgba(0,0,0,.5);--shadow-s:0 6px 18px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;padding:28px 16px 60px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.stage,.sheet{zoom:.9}
.stage{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.pill{align-self:center;display:flex;align-items:center;gap:12px;padding:7px 10px 7px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-s);font-weight:600;font-size:16px}
.av{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;background:var(--accent)}
.label{font-size:11.5px;font-weight:600;letter-spacing:.09em;color:var(--faint)}
/* suggestion card */
.sug{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-s);padding:18px 18px 10px}
.sug-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.sug-head h2{font-size:16px;margin:0;letter-spacing:-.01em}
.sug-head small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:1px}
.x{width:30px;height:30px;border-radius:50%;border:0;background:var(--sunken);color:var(--muted);font-size:13px}
.slot{display:flex;align-items:center;gap:14px;width:100%;padding:12px 10px;border:0;background:none;border-radius:16px;text-align:left;transition:background .15s}
.slot:hover{background:var(--sunken)}
.slot+.slot{margin-top:2px}
.ghost{width:40px;height:40px;border-radius:12px;border:1.5px dashed var(--accent-line);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;background:var(--accent-soft)}
.ghost.p{border-radius:50%}
.ghost svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.slot b{display:block;font-size:15px;font-weight:600}
.slot span.d{color:var(--muted);font-size:13.5px}
.slot .go{margin-left:auto;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.slot:hover .go{border-color:var(--accent-line);color:var(--accent)}
.slot.done .ghost{border-style:solid;background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.slot.done .go{border:0;background:var(--ok-soft);color:var(--ok)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.tile b{display:block;font-size:15px}
.tile .d{color:var(--muted);font-size:13px}
.tile .plus{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex-shrink:0}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.roles button{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.roles button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
@media (max-width:520px){.duo{grid-template-columns:1fr}}
.feed{display:flex;flex-direction:column;align-items:center;gap:10px;opacity:.55}
.sys{display:flex;align-items:center;gap:9px;background:var(--sunken);border-radius:999px;padding:5px 14px 5px 5px;font-size:13.5px;color:var(--muted)}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;animation:fade .18s ease-out}
.sheet{width:min(460px,100%);max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:18px;animation:rise .22s ease-out}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(10px);opacity:0}}
.sh-head{display:flex;align-items:flex-start;gap:14px}
.sh-head h3{margin:0;font-size:19px;letter-spacing:-.02em}
.sh-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sh-head .x{margin-left:auto;flex-shrink:0}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.app i{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:700;font-size:14px}
.app[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.how{display:flex;flex-direction:column;gap:10px;background:var(--sunken);border-radius:18px;padding:14px;height:236px;gap:12px}
.how .step>div{display:flex;align-items:flex-start}
.how .last{margin-top:auto}
.how .step{display:flex;gap:10px;font-size:14px;align-items:flex-start}
.how .n{width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.snip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 5px 5px 14px;font:13px var(--mono);min-width:0}
.snip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:14.5px}
.btn.sm{height:32px;padding:0 13px;font-size:13px}
.btn.wide{width:100%}
.btn.ghostb{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.wait{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);justify-content:center}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{opacity:.25;transform:scale(.7)}}
.code{display:flex;align-items:center;justify-content:center;gap:10px;font:600 19px var(--mono);letter-spacing:.08em;padding:6px 0}
.codecap{text-align:center;color:var(--muted);font-size:13px;margin-top:-12px}
.opts{border-top:1px solid var(--line);padding-top:6px}
.opts summary{list-style:none;display:flex;align-items:center;justify-content:space-between;height:40px;font-size:14px;font-weight:600;cursor:pointer}
.opts summary::-webkit-details-marker{display:none}
.opts summary .chev{color:var(--faint);transition:transform .2s}
.opts[open] summary .chev{transform:rotate(180deg)}
.opt{display:flex;align-items:center;gap:12px;height:44px;font-size:14px}
.opt span{flex:1}
.toggle{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;border:0;padding:0;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{left:19px}
.stepper{display:flex;align-items:center;gap:2px;background:var(--sunken);border-radius:999px;padding:3px}
.stepper button{width:28px;height:28px;border-radius:50%;border:0;background:var(--surface);font-weight:700;color:var(--muted)}
.stepper output{min-width:38px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.foot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--faint);flex-wrap:wrap}
.foot button{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:4px 8px;border-radius:8px}
.foot button:hover{background:var(--sunken)}
.foot .danger{color:var(--bad)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;z-index:20}
.note{text-align:center;color:var(--faint);font-size:12.5px}
@media (max-width:480px){.apps{grid-template-columns:repeat(2,1fr)}.slot .go{padding:0 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stage">
  <div class="pill"># hh <span class="av">H</span></div>

  <section class="sug" aria-labelledby="sug-title">
    <div class="sug-head">
      <h2 id="sug-title">Who should join?<small>Nobody joins until you invite them.</small></h2>
      <button class="x" id="hide" aria-label="Hide suggestions">✕</button>
    </div>
    <div class="duo">
      <button class="tile" data-open="ai"><span class="ghost"><svg viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg></span><span><b>An AI</b><span class="d">Builds, reviews or helps</span></span><span class="plus" aria-hidden="true">+</span></button>
      <button class="tile" data-open="person"><span class="ghost p"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span><span><b>A person</b><span class="d">Decides and approves</span></span><span class="plus" aria-hidden="true">+</span></button>
    </div>
  </section>
  <p class="note">Mockup · click An AI or A person.</p>
</div>

<script>
const $=s=>document.querySelector(s);
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1700)};
const APPS={
  ai:[['Claude','#d97757','C',null,'In Claude, choose Add and sign in.'],['ChatGPT','#10a37f','G','https://centralcity.ai/mcp','In Plugins, Build MCP Apps, paste it, OAuth.'],['Claude Code','#b45309','C','claude mcp add --transport http central-city https://centralcity.ai/mcp','Run /mcp and choose Authenticate.'],['Codex','#0f172a','X','codex mcp add central-city --url https://centralcity.ai/mcp','Run: codex mcp login central-city'],['Cursor','#334155','▲',null,'In Cursor, confirm and sign in.'],['Other','#64748b','+','https://centralcity.ai/mcp','Add it as a connector, then sign in.']],
  coder:[['Claude Code','#d97757','C','claude mcp add --transport http central-city https://centralcity.ai/mcp','Run /mcp and choose Authenticate.'],['Codex','#10a37f','X','codex mcp add central-city --url https://centralcity.ai/mcp','Run: codex mcp login central-city'],['Cursor','#0f172a','▲',null,'In Cursor, confirm and sign in.'],['Other','#64748b','+','https://centralcity.ai/mcp','Add it as a connector, then sign in.']],
  reviewer:[['Claude','#d97757','C',null,'In Claude, choose Add and sign in.'],['ChatGPT','#10a37f','G','https://centralcity.ai/mcp','In ChatGPT: Plugins, Build MCP Apps, paste the address, choose OAuth.'],['Claude Code','#b45309','C','claude mcp add --transport http central-city https://centralcity.ai/mcp','Run /mcp and choose Authenticate.'],['Other','#64748b','+','https://centralcity.ai/mcp','Add it as a connector, then sign in.']]
};
const META={ai:['Add an AI','Pick your AI app. It joins this room only.'],coder:['Add a coding AI','It joins as the room’s builder and picks up tasks.'],reviewer:['Add a reviewer AI','It joins as the room’s reviewer and checks work before it ships.']};
let pick={coder:0,reviewer:0,ai:0};let role='Builds';
function role0(r){return r==='ai'?`<div class="roles" role="group" aria-label="Its job here">${['Builds','Reviews','Helps'].map(x=>`<button aria-pressed="${x===role}" data-role="${x}">${x}</button>`).join('')}</div>`:''}
function aiSheet(role){const [title,sub]=META[role];const list=APPS[role];const a=list[pick[role]];
return `<div class="sh-head"><span class="ghost">${role==='ai'?'<svg viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg>':role==='coder'?'<svg viewBox="0 0 24 24"><path d="M8 9l-3 3 3 3M16 9l3 3-3 3M13 7l-2 10"/></svg>':'<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'}</span><div><h3>${title}</h3><p>${sub}</p></div><button class="x" data-close aria-label="Close">✕</button></div>
<div class="label">WHICH AI?</div>
<div class="apps" role="group" aria-label="Choose your AI">${list.map(([n,c,g],i)=>`<button class="app" aria-pressed="${i===pick[role]}" data-pick="${role}:${i}"><i style="background:${c}">${g}</i>${n}</button>`).join('')}</div>
<div class="how"><div class="step"><span class="n">1</span><div>${a[3]?(a[3].startsWith('http')?'Add this address to '+a[0]+':':'Run this in your terminal:'):'Open '+a[0]+' with Central City ready:'}</div></div>
${a[3]?`<div class="snip"><span>${a[3]}</span><button class="btn sm" data-copy="${a[3]}">Copy</button></div>`:`<div class="snip"><span style="font-family:var(--sans)">${a[0]} · Central City connector</span><button class="btn sm" data-toast="Opening ${a[0]}…">Open</button></div>`}
<div class="step"><span class="n">2</span><div>${a[4]}</div></div>
<div class="step"><span class="n">3</span><div>Then paste the room invite into ${a[0]}.</div></div>
<button class="btn wide ghostb last" data-copy="centralcity.ai/r/hh#2FWH-JE1Z">Copy room invite for your AI</button></div>
<div class="wait"><span class="pulse"></span>Waiting for your AI to join…</div>`}
function personSheet(){return `<div class="sh-head"><span class="ghost p"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span><div><h3>Invite a person</h3><p>Share the link or the code.</p></div><button class="x" data-close aria-label="Close">✕</button></div>
<button class="btn wide" data-copy="centralcity.ai/r/hh#2FWH-JE1Z">⧉&nbsp; Copy invite link</button>
<div class="code" aria-label="Room code">2FWH-JE1Z <button class="x" data-copy="2FWH-JE1Z" aria-label="Copy code">⧉</button></div>
<div class="codecap">or join with this code at centralcity.ai</div>
<details class="opts"><summary>Room access <span class="chev">▾</span></summary>
${[['Can read earlier messages',1],['People join as themselves',1],['Members can bring their AI',1],['Private messages',1]].map(([t,on])=>`<div class="opt"><span>${t}</span><button class="toggle" role="switch" aria-checked="${on?'true':'false'}" aria-label="${t}" data-flip></button></div>`).join('')}
<div class="opt"><span>Member limit</span><div class="stepper"><button data-step="-1" aria-label="Fewer">−</button><output id="lim">100</output><button data-step="1" aria-label="More">+</button></div></div>
<div class="foot"><span>Link valid until 6 Oct, 10:10</span><span style="flex:1"></span><button data-toast="New link made">New link</button><button class="danger" data-toast="Link revoked">Revoke</button></div>
</details>`}
function open(kind){const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${kind==='person'?personSheet():aiSheet(kind)}</div>`;s.dataset.kind=kind;document.body.append(s);s.querySelector('.sheet button')?.focus()}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-role],[data-open],[data-close],[data-pick],[data-copy],[data-toast],[data-flip],[data-step],#hide,.scrim');if(!t)return;
 if(t.classList.contains('scrim')){if(e.target===t)t.remove();return}
 if(t.dataset.role){role=t.dataset.role;t.closest('.sheet').innerHTML=aiSheet('ai');return}
 if(t.dataset.open){open(t.dataset.open);return}
 if(t.dataset.close!==undefined){t.closest('.scrim').remove();return}
 if(t.dataset.pick){const [r,i]=t.dataset.pick.split(':');pick[r]=+i;t.closest('.sheet').innerHTML=aiSheet(r);return}
 if(t.dataset.copy){const v=t.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copied'),()=>toast('Select and copy'));return}
 if(t.dataset.toast){toast(t.dataset.toast);return}
 if(t.dataset.flip!==undefined){t.setAttribute('aria-checked',t.getAttribute('aria-checked')==='true'?'false':'true');return}
 if(t.dataset.step){const o=$('#lim');o.textContent=Math.max(2,Math.min(10000,+o.textContent+(+t.dataset.step)*10));return}
 if(t.id==='hide'){t.closest('.sug').hidden=true;toast('Hidden. Bring it back from ⋯');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.scrim')?.remove()});
</script>
